['Diwash · Product Owner',270,

['Diwash · Product Owner',210,
`<div class="k" d>01 · Background</div><h2 d>Booking a cafe table shouldn’t take calls.</h2><p class="sub" d>Who has it: customers, families and groups of friends. Why it matters: they want to save time and avoid queues.</p>${G(C('Call the cafe','Or visit in person, just to ask.','Today')+C('Wait for a reply','Messages are slow and easy to lose.','Today')+C('Guess what’s free','No view of tables, changes or cancellations.','Today'))}`],
['Diwash · Product Owner',190,
`<div class="k" d>02 · Vision and product goal</div><h2 d>See the table. Book in minutes.</h2><p class="sub" d>Develop a simple, user-friendly cafe booking website that makes reservations quick, easy and convenient.</p>${G(C('For','Customers, families, friends and groups.')+C('Who need','A quick way to reserve without waiting.')+C('Unlike','Phone calls or visiting, it books online at any time.'))}`],
['Bhawna · Scrum Master',230,
`<div class="k" d>03 · User persona</div><div class="row"><div class="c" d style="max-width:270px"><div class="av">EJ</div><b>Emily Johnson</b><span>25 · College student · loves cafes with friends and family</span></div><div style="flex:1;min-width:260px"><p class="q" d>“I want to book a cafe table quickly without phone calls.”</p>${G(C('Wants','Check tables, book without waiting.')+C('Problem','Must call or visit in person.')+C('Needs','Date, time, guests, confirm.'))}</div></div>`],
['Bhawna · Scrum Master',200,
`<div class="k" d>04 · User stories for the prototype</div><h2 d>Ten stories. One journey.</h2><svg class="dl jr" viewBox="0 0 1000 230" d><path id="jp" pathLength="1" d="M30 150C190 40 300 220 500 120S800 30 970 100"/></svg>${MQ('Home page · 3D cafe view · Table availability · Choose a table · Make reservation · Confirmation · Pick day · Terrace seating · Save reservation · Verification code',1)}`],

`<div class="k" d>05 · Agile journey</div><h2 d>One sprint. One goal.</h2><p class="sub" d>Explore in 3D, pick a date, choose a table, confirm online.</p><div class="row" style="margin-top:3vh;gap:14px">${N(4,'','To do')}${N(3,'','In progress')}${N(3,'','Testing')}${N(4,'','Done',1)}</div>${PL(['Acceptance criteria met','Test recorded','Shown to the team','Bookings saved correctly'])}`],
['Harshdeep · Developer',180,
`<div class="k" d>06 · Design</div><h2 d>Calm glass. Golden titles.</h2>${G(C('Home','Explore the cafe or Reserve a table.','Screen 1')+C('Contact','Phone, Maps and Email in one row.','Screen 3')+`<div class="c" d><em>SCREEN 2</em><b>Tour</b><span>3D cafe with a Home button. Try the light:</span>${[['Day',0],['Dusk',60],['Night',200]].map(m=>`<button class="bt s" data-h="${m[1]}">${m[0]}</button>`).join('')}</div>`)}`],
['Harshdeep · Sulav as Emily',300,
`<div class="k" d>07 · Live demo · Sulav is Emily · Harshdeep drives</div><h2 d>Emily books a table.</h2>${G([['1','Explore the cafe','“I’ll look around first.” Day, Dusk, Night, Kiosk, Kitchen.'],['2','Pick date and guests','“Friday evening, four of us.”'],['3','Choose a free table','“That one by the water.” Taken tables can’t be booked.'],['4','Verify and confirm','“Here’s my code.” Details, 6-digit code, confirmation.']].map(s=>C(s[1],s[2],'Step '+s[0])).join(''))}${PL(['Tricky: pick a taken table','Tricky: three wrong codes'])}`],
